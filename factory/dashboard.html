<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff5555;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 28px 32px 8px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Board */
  .board {
    display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 12px;
    padding: 20px 32px 40px; align-items: start;
  }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 10px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative;
  }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .col:not(:last-child):not(:nth-last-child(2)) .col-head::after {
    content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px;
  }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  .col.merged-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.attn {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent),
                0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.done { opacity: .72; }
  .card.rejected .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--active);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    font-size: 10px; font-weight: 600; letter-spacing: .06em; line-height: 1.5;
    text-transform: uppercase; color: var(--muted); margin: 0 0 4px;
  }
  .flag.you { color: var(--human); } .flag.todo { color: var(--changes); } .flag.live { color: var(--active); }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: 11px; min-width: 0; }
  .links a { color: var(--active); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .branch {
    font-family: var(--mono); font-size: 11px; color: var(--faint); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); line-height: 19px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .chip {
    flex: none; max-width: 100%; white-space: nowrap; font-family: var(--mono); font-size: 10px;
    padding: 1px 5px; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint);
  }
  .chip.wait { border-color: var(--active); color: var(--active); animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.FAIL {
    border: 1px solid transparent; color: var(--human);
    background: color-mix(in srgb, var(--human) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .hint {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6;
    overflow-wrap: anywhere;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }
  .md .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px 4px; margin: 0 0 22px;
  }
  .md .summary h2 {
    margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  @media (max-width: 1680px) {
    .board { grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 28px; }
  }
  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>Software factory</h1>
  <div class="status" id="status">connecting…</div>
</header>
<div id="banner"></div>
<main class="board" id="board"></main>
<footer>
  <span>/factory run</span>
  <span>/factory run &lt;n&gt;</span>
  <span>/factory &lt;anything&gt;</span>
  <span id="totals"></span>
</footer>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const COLUMNS = [
  { label: 'Queued', who: 'requests', stages: ['queued'] },
  { label: 'Intake', who: 'intake · opus', stages: ['intake', 'needs-info'] },
  { label: 'Spec', who: 'spec-writer · your review', stages: ['spec', 'spec-review'] },
  { label: 'Build', who: 'builders · gate', stages: ['build', 'gate'] },
  { label: 'Review', who: 'routed reviewers', stages: ['review'] },
  { label: 'Approve', who: 'approver', stages: ['approve'] },
  { label: 'Needs human', who: 'you', stages: ['needs-human'], cls: 'human' },
  { label: 'PR ready', who: 'your PR review', stages: ['ready'], cls: 'merged-col' },
  { label: 'Done', who: 'closed · rejected', stages: ['closed', 'rejected'], cls: 'merged-col' },
]
const STAGES = new Set(COLUMNS.flatMap((c) => c.stages))
const LIVE = new Set(['intake', 'spec', 'build', 'gate', 'review', 'approve'])
const TERMINAL = new Set(['closed', 'rejected'])
const WAITS_ON_YOU = new Set(['needs-info', 'spec-review', 'needs-human'])
const SHORT = { quality: 'qual', backend: 'back' }
// dashboard.html?demo shows the sample jobs in demo/jobs/, at a fixed time.
const DEMO = new URLSearchParams(location.search).has('demo')
const ROOT = DEMO ? 'demo/jobs/' : 'jobs/'
const now = () => (DEMO ? new Date('2026-01-15T12:00:00Z') : new Date())

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let jobs = []
const lastGood = new Map() // job id -> last job.json that loaded
const failing = new Map() // job id -> polls in a row that failed to load it
const roundCache = new Map() // "<job>/<n>" -> verdicts of a round that can't change any more
let openJobId = null
let openPath = null
let openText = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw Object.assign(new Error(`${url}: HTTP ${res.status}`), { status: res.status })
  return res.text()
}

// Only a 404 means "not there"; any other failure is an error the poll reports.
async function orMissing(promise, missing) {
  try { return await promise } catch (err) { if (err.status === 404) return missing; throw err }
}

// python -m http.server serves an HTML index for directories; read its links.
async function listDir(url) {
  const doc = new DOMParser().parseFromString(await fetchText(url), 'text/html')
  return [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
}

const firstLine = (text) => text.split('\n')[0].trim()

// ---- Board ---------------------------------------------------------------

// The same lines bin/job accepts. A missing or still empty file is pending.
const GATE = /^GATE:\s*(PASS|FAIL)$/
const VERDICT = /^VERDICT:\s*(PASS|CHANGES)$/

function verdictOf(text, pattern) {
  const line = firstLine(text || '')
  if (!line) return 'pending'
  return line.match(pattern)?.[1] || 'invalid'
}

// A round's verdicts come from its files: the gate first, then each reviewer.
async function roundVerdicts(job, n) {
  const key = `${job.id}/${n}`
  if (roundCache.has(key)) return roundCache.get(key)
  const dir = `${ROOT}${job.id}/round-${n}/`
  const current = n === job.round
  const files = new Set(await orMissing(listDir(dir), []))
  const read = async (name, pattern) =>
    verdictOf(files.has(name) ? await orMissing(fetchText(dir + name), '') : '', pattern)
  const v = { gate: await read('checks.md', GATE), reviews: {} }
  if (v.gate === 'PASS') {
    // The routed set can grow between rounds: a past round shows who reviewed it.
    const names = Object.keys(job.agents?.reviewers || {})
      .filter((r) => job.round_reviewers?.[n]?.includes(r) ?? (current || files.has(`review-${r}.md`)))
    const verdicts = await Promise.all(names.map((r) => read(`review-${r}.md`, VERDICT)))
    names.forEach((r, i) => { v.reviews[r] = verdicts[i] })
  }
  if (!current || !LIVE.has(job.stage)) roundCache.set(key, v)
  return v
}

const MARK = { PASS: '✓', CHANGES: '!', FAIL: '✕', pending: '·', invalid: '?' }
const CHIP_TITLE = { invalid: 'first line is not a verdict' }

function chip(label, v, waiting = false, title = label) {
  const cls = ['PASS', 'CHANGES', 'FAIL'].includes(v) ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
  const said = CHIP_TITLE[v] || (v === 'pending' && waiting ? 'running' : v)
  return `<span class="chip ${cls}" title="${esc(title)}: ${esc(said)}">${v === 'pending' && waiting ? '…' : MARK[v]} ${esc(label)}</span>`
}

function roundRow(job, n, v) {
  const current = n === job.round && !TERMINAL.has(job.stage)
  const cells = [chip('gate', v.gate, current && job.stage === 'gate')]
  const reviews = Object.entries(v.reviews)
  const passed = reviews.filter(([, x]) => x === 'PASS').map(([r]) => r)
  // Finished rounds collapse their passes; the rest stay named.
  if (!current && passed.length) {
    cells.push(`<span class="chip PASS" title="PASS: ${esc(passed.join(', '))}">✓ ${passed.length} pass</span>`)
  }
  for (const [r, x] of reviews) {
    if (current || x !== 'PASS') cells.push(chip(SHORT[r] || r, x, current && job.stage === 'review', r))
  }
  return `<div class="round"><span class="r">R${n}</span><div class="chips">${cells.join('')}</div></div>`
}

const PACKAGE = {
  pending: { cls: '', mark: '·' }, building: { cls: 'wait', mark: '…' },
  done: { cls: 'PASS', mark: '✓' }, blocked: { cls: 'FAIL', mark: '✕' },
}

// Work packages build in round 1; once they are all merged one chip says so.
function packageRow(job) {
  const wps = job.packages || []
  if (!wps.length) return ''
  const done = wps.filter((p) => p.status === 'done').length
  const cells = done === wps.length
    ? [`<span class="chip PASS">✓ ${done}/${wps.length} packages</span>`]
    : wps.map((p) => {
        const s = PACKAGE[p.status] || { cls: 'bad', mark: '?' }
        return `<span class="chip ${s.cls}" title="${esc(`${p.id} ${p.title}: ${p.status}`)}">${s.mark} ${esc(p.id)}</span>`
      })
  return `<div class="round"><span class="r">WP</span><div class="chips">${cells.join('')}</div></div>`
}

const minutes = (min) => (min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}m` : `${min}m`)

const since = (stamp, end = now()) => Math.max(0, (end - new Date(stamp)) / 1000)
const duration = (seconds) => minutes(Math.floor(seconds / 60))

// Time in running stages: not queued, and not waiting on you. Same as bin/job.
function elapsed(job) {
  if (!job.stage_since) return duration(since(job.started, job.ended ? new Date(job.ended) : now()))
  return duration((job.active_seconds || 0) + (LIVE.has(job.stage) ? since(job.stage_since) : 0))
}

function times(job) {
  if (!job.stage_since || TERMINAL.has(job.stage)) return elapsed(job)
  return `${elapsed(job)} · ${duration(since(job.stage_since))} here`
}

// An approved job that has no slot yet waits on the factory, not on you.
const needsYou = (job) => !job.pending && (WAITS_ON_YOU.has(job.stage) || job.stage === 'ready')

function statusOf(job, v) {
  if (job.pending) return ['todo', `waiting for a slot → ${job.pending}`]
  const reviews = Object.values(v?.reviews || {})
  switch (job.stage) {
    case 'queued': return ['', 'queued']
    case 'intake': return ['live', 'reading the request']
    case 'needs-info': return ['you', 'answer intake']
    case 'spec': return ['live', 'writing the spec']
    case 'spec-review': return ['you', 'review spec']
    case 'build': return ['live', job.round > 1 ? `building round ${job.round}` : 'building']
    case 'gate': return ['live', 'running checks']
    case 'review': return ['live', `${reviews.filter((x) => x !== 'pending').length}/${reviews.length} reviews in`]
    case 'approve': return ['live', 'approver deciding']
    case 'needs-human': return ['you', 'your call']
    case 'ready': return ['todo', 'open PR']
    default: return ['', job.stage]
  }
}

const DECISION = { APPROVE: ['PASS', '✓'], DENY: ['FAIL', '✕'], ESCALATE: ['FAIL', '!'] }

function cost(job) {
  const unpriced = job.unpriced_models || []
  return `<span${unpriced.length ? ` title="not priced: ${esc(unpriced.join(', '))}"` : ''}>$${Number(job.cost_usd || 0).toFixed(2)}${unpriced.length ? '+' : ''}</span>`
}

function links(job) {
  const out = []
  if (job.agents && job.branch) { // routed: the branch exists from spec on
    out.push(`<span class="branch" title="${esc(job.branch)}">${esc(job.branch)}</span>`)
  }
  // Before the approver decides, a decision can only be an older round's.
  const decided = !['build', 'gate', 'review'].includes(job.stage)
  const [cls, mark] = (decided && DECISION[job.decision]) || []
  if (cls) out.push(`<span class="chip ${cls}" title="decision.md">${mark} ${esc(job.decision)}</span>`)
  return out.join('')
}

function hint(job) {
  if (job.pending) return ''
  if (job.stage === 'needs-human') return 'read decision.md, then give feedback or reject: /factory &lt;anything&gt;'
  if (job.stage === 'ready') return 'open the PR with PR.md; see REVIEW.md'
  return ''
}

// Times go in separately (data-time), so a passing minute doesn't rebuild the card.
function card(job, verdicts) {
  const live = LIVE.has(job.stage)
  const [num, ...slug] = job.id.split('-')
  const [flagCls, flag] = statusOf(job, verdicts[verdicts.length - 1])
  const risk = job.intake?.risk
  const rows = packageRow(job) + verdicts.map((v, i) => roundRow(job, i + 1, v)).join('')
  return `
    <article class="card ${live ? 'live' : ''} ${needsYou(job) && job.stage !== 'ready' ? 'attn' : ''} ${TERMINAL.has(job.stage) ? 'done' : ''} ${job.stage === 'rejected' ? 'rejected' : ''}"
             data-job="${esc(job.id)}" tabindex="0" role="button">
      <div class="card-top">
        ${live ? '<span class="pulse"></span>' : ''}
        <span class="num" title="${esc(job.id)}">${esc(num)} · ${esc(slug.join('-'))}</span>
      </div>
      <div class="flag ${flagCls}">${esc(flag)}</div>
      <p class="feature">${esc(job.title)}</p>
      <div class="links">${links(job)}</div>
      ${rows ? `<div class="rounds">${rows}</div>` : ''}
      <div class="meta">${risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : ''}${cost(job)}<span data-time title="running time · time in this stage"></span></div>
      ${hint(job) ? `<div class="hint">${hint(job)}</div>` : ''}
    </article>`
}

$('board').innerHTML = COLUMNS.map((c) => `
  <section class="col ${c.cls || ''}">
    <div class="col-head">
      <h2>${c.label}</h2><span class="who" title="${c.who}">${c.who}</span><span class="count"></span>
    </div>
    <div class="cards"></div><div class="empty">—</div>
  </section>`).join('')

const drawn = new Map() // job id -> { html, el }

// Redraw only the cards that changed, so pulses keep their beat and focus stays put.
function drawCard(job, verdicts) {
  const html = card(job, verdicts)
  let d = drawn.get(job.id)
  if (!d || d.html !== html) {
    const t = document.createElement('template')
    t.innerHTML = html.trim()
    const el = t.content.firstElementChild
    const focused = d && document.activeElement === d.el
    if (d) d.el.replaceWith(el)
    d = { html, el }
    drawn.set(job.id, d)
    if (focused) el.focus()
  }
  const time = d.el.querySelector('[data-time]')
  if (time.textContent !== times(job)) time.textContent = times(job)
  return d.el
}

async function render(problems) {
  const columns = new Map(COLUMNS.map((c) => [c, []]))
  const verdicts = await Promise.all(jobs.map((job) =>
    Promise.all(Array.from({ length: job.round }, (_, i) => roundVerdicts(job, i + 1)))))
  jobs.forEach((job, i) => {
    if (!STAGES.has(job.stage)) { problems.push(`Job ${job.id} has unknown stage "${job.stage}"`); return }
    // Newest first within a column.
    columns.get(COLUMNS.find((c) => c.stages.includes(job.stage))).unshift([job, verdicts[i]])
  })
  const shown = new Set([...columns.values()].flat().map(([job]) => job.id))
  for (const [id, d] of drawn) if (!shown.has(id)) { d.el.remove(); drawn.delete(id) }
  COLUMNS.forEach((c, i) => {
    const col = $('board').children[i]
    const list = col.querySelector('.cards')
    const cards = columns.get(c)
    cards.forEach(([job, v], k) => {
      const el = drawCard(job, v)
      if (list.children[k] === el) return
      const focused = document.activeElement === el
      list.insertBefore(el, list.children[k] || null)
      if (focused) el.focus()
    })
    col.querySelector('.count').textContent = cards.length || ''
    col.querySelector('.empty').hidden = cards.length > 0
  })
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  if ($('banner').innerHTML !== banner) $('banner').innerHTML = banner
  const running = jobs.filter((j) => LIVE.has(j.stage)).length
  const total = jobs.reduce((sum, j) => sum + Number(j.cost_usd || 0), 0)
  $('totals').textContent = `${running} running · ${jobs.filter(needsYou).length} need you · $${total.toFixed(2)} API-equivalent`
}

let lastUpdate = null

async function poll() {
  const status = $('status')
  try {
    const problems = []
    jobs = await loadJobs(problems)
    await render(problems)
    if (openJobId) await refreshDrawer()
    lastUpdate = new Date().toLocaleTimeString()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>${DEMO ? 'demo · ' : ''}${ROOT} · ${lastUpdate}`
  } catch (err) {
    // The board keeps what it last showed; say that it is old.
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}${lastUpdate ? ` · last update ${lastUpdate}` : ''}`
  }
}

// factory/bin/job writes each jobs/<id>/job.json. One that fails to load keeps
// its last state for a poll (it may be half created), then is reported.
async function loadJobs(problems) {
  const ids = (await orMissing(listDir(ROOT), []))
    .filter((h) => h.endsWith('/')).map((h) => h.slice(0, -1)).sort()
  const loaded = await Promise.all(ids.map(async (id) => {
    try {
      const job = JSON.parse(await fetchText(`${ROOT}${id}/job.json`))
      if (job.id !== id || !job.stage || !Number.isInteger(job.round)) throw new Error('not a job: needs id, stage and round')
      lastGood.set(id, job)
      failing.delete(id)
    } catch (err) {
      failing.set(id, (failing.get(id) || 0) + 1)
      if (failing.get(id) > 1) problems.push(`Job ${id}: job.json doesn't load (${err.message})`)
    }
    return lastGood.get(id)
  }))
  return loaded.filter(Boolean)
}

// ---- Drawer --------------------------------------------------------------

async function listFiles(dir) {
  const out = []
  for (const h of await listDir(dir)) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

const ORDER = ['request.md', 'issue.md', 'intake.md', 'spec.md', 'spec-approval.md', 'build.md', 'decision.md', 'PR.md', 'PR-qa.md', 'REVIEW.md', 'rejection.md']
const ROUND_ORDER = ['checks', 'review-quality', 'review-bugs', 'review-backend', 'review-dba', 'review-ops', 'review-appsec', 'review-opsec', 'review-ux', 'review-ui']

function fileRank(path) {
  if (ORDER.includes(path)) return [0, ORDER.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/(.+)\.md$/)
  if (round) return [2, Number(round[1]) * 100 + ROUND_ORDER.indexOf(round[2]), path]
  return [1, 0, path] // build-wp<k>.md, intake-<k>.md, feedback-<k>.md
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|APPROVED|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|DENY|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()
let drawnFiles = null

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  const wanted = openPath
  const stale = () => openJobId !== job.id || openPath !== wanted // the user moved on meanwhile
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''} · $${Number(job.cost_usd || 0).toFixed(2)} · ${times(job)}`
  $('d-title').textContent = job.title
  $('d-links').innerHTML = links(job)

  const base = `${ROOT}${job.id}/`
  const files = sortFiles(await listFiles(base))
  const path = wanted && files.includes(wanted) ? wanted : files[0] || null
  // Past rounds don't change; every other file's dot follows its current first line.
  const past = (f) => { const m = f.match(/^round-(\d+)\//); return m && Number(m[1]) < job.round }
  await Promise.all(files.filter((f) => f !== path && !(past(f) && firstLines.has(base + f))).map(async (f) => {
    firstLines.set(base + f, firstLine(await orMissing(fetchText(base + f), '')))
  }))
  const text = path ? await orMissing(fetchText(base + path), '') : null
  if (stale()) return
  openPath = path
  if (path) firstLines.set(base + path, firstLine(text))

  let group = null
  const list = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'
  if (list !== drawnFiles) {
    const focused = document.activeElement?.dataset?.file
    drawnFiles = list
    $('d-files').innerHTML = list
    if (focused) $('d-files').querySelector(`[data-file="${CSS.escape(focused)}"]`)?.focus()
  }

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">Nothing written yet.</p>' : markdown(text)
  }
}

async function openDrawer(id) {
  openJobId = id
  openPath = null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer().catch((err) => { $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>` })
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const cardEl = e.target.closest?.('[data-job]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.job) }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (intake.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z0-9-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

async function loop() {
  await poll()
  setTimeout(loop, POLL_MS) // after the poll, so polls never overlap
}
loop()
</script>
